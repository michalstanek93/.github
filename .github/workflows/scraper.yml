name: NSoud Scraper a Sumarizace

on:
  schedule:
    # Běží každý 3. den v 6:00 ráno UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Umožní ruční spuštění tlačítkem kdykoliv

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Načtení kódu
      uses: actions/checkout@v4   # <-- Změněno z v3 na v4

    - name: Nastavení Pythonu
      uses: actions/setup-python@v5  # <-- Změněno z v4 na v5
      with:
        python-version: '3.10'

    - name: Instalace knihoven
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Spuštění skriptu
      env:
       OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: python main.py
